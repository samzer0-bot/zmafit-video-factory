name: مصنع الرسومات التلقائي (Anatomy drawings autogen)

# كل يومين: تمرينان جديدان → Cloudflare يرسم → Gemini Vision يفحص → المقبول يدخل المكتبة
on:
  schedule:
    - cron: "41 3 */2 * *"
  workflow_dispatch:
    inputs:
      count: {description: "عدد التمارين", default: "2", required: false}

permissions:
  contents: write

concurrency:
  group: anatomy-autogen
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pillow numpy
      - name: توليد وفحص
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/anatomy_autogen.py "${{ inputs.count || '2' }}"
      - name: نشر المحاولات للمراجعة
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls autogen_out/* >/dev/null 2>&1 || exit 0
          gh release view anatomy-autogen >/dev/null 2>&1 || gh release create anatomy-autogen --prerelease --title "Anatomy autogen" --notes "كل محاولات الرسم وحكم Gemini" || true
          gh release upload anatomy-autogen autogen_out/* --clobber
      - name: حفظ الرسومات المقبولة
        run: |
          git config user.name "video-factory"; git config user.email "actions@github.com"
          git add assets/anatomy
          git commit -m "anatomy: رسومات جديدة تلقائياً [skip ci]" || { echo "no changes"; exit 0; }
          git pull --rebase || true; git push
