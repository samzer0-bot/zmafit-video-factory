name: فيديوهات التشريح — القناتان (Anatomy factory)

# إضافة للمصنع الحالي (لا يستبدله). عدد قليل أسبوعياً لتفادي سياسة المحتوى المتكرر.
on:
  schedule:
    - cron: "23 18 * * *"        # Muscle Arabia — شورت يومياً 19:23 بتوقيت الجزائر
    - cron: "27 21 * * *"        # ZMAFIT — Short daily (4:27pm US Eastern)
    - cron: "13 11 * * 2,6"      # Muscle Arabia — فيديو طويل الثلاثاء والسبت
    - cron: "11 16 * * 3,0"      # ZMAFIT — long video Wed & Sun
    # مواعيد احتياطية: جدولة GitHub تتأخر ساعات أو تُسقط التشغيل أحياناً.
    # كل احتياطي يتحقق من السجل ولا ينشر إن كان فيديو اليوم قد نُشر بالفعل.
    - cron: "43 20 * * *"        # احتياطي 1 — شورت عربي
    - cron: "13 23 * * *"        # احتياطي 2 — شورت عربي
    - cron: "47 22 * * *"        # backup 1 — EN short
    - cron: "49 23 * * *"        # backup 2 — EN short
    - cron: "13 14 * * 2,6"      # احتياطي 1 — طويل عربي
    - cron: "13 18 * * 2,6"      # احتياطي 2 — طويل عربي
    - cron: "11 19 * * 3,0"      # backup 1 — EN long
    - cron: "21 22 * * 3,0"      # backup 2 — EN long
  workflow_dispatch:
    inputs:
      lang: {description: "ar / en", type: choice, options: [ar, en], default: ar}
      format: {description: "الصيغة", type: choice, options: [shorts, long], default: shorts}
      template: {description: "قالب محدد (اختياري): mistake, myth, rank, compare, chapters", required: false, default: ""}

permissions:
  contents: write

concurrency:
  group: anatomy-${{ github.event.schedule || inputs.lang }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: تحديد القناة والصيغة
        id: cfg
        run: |
          S="${{ github.event.schedule }}"
          case "$S" in
            "23 18 * * *"|"43 20 * * *"|"13 23 * * *")          L=ar; F=shorts ;;
            "27 21 * * *"|"47 22 * * *"|"49 23 * * *")          L=en; F=shorts ;;
            "13 11 * * 2,6"|"13 14 * * 2,6"|"13 18 * * 2,6")    L=ar; F=long ;;
            "11 16 * * 3,0"|"11 19 * * 3,0"|"21 22 * * 3,0")    L=en; F=long ;;
            *) L="${{ inputs.lang }}"; F="${{ inputs.format }}" ;;
          esac
          echo "lang=$L" >> $GITHUB_OUTPUT; echo "format=$F" >> $GITHUB_OUTPUT
      - name: هل نُشر فيديو اليوم بالفعل؟ (لمنع التكرار مع المواعيد الاحتياطية)
        id: guard
        env:
          L: ${{ steps.cfg.outputs.lang }}
          F: ${{ steps.cfg.outputs.format }}
          EV: ${{ github.event_name }}
        run: |
          git pull -q --ff-only || true
          python - <<'PY'
          import json, os, datetime
          skip = "false"
          if os.environ["EV"] == "schedule":
              today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
              try: h = json.load(open("assets/anatomy/history.json", encoding="utf-8"))
              except Exception: h = []
              if any(x.get("date", "")[:10] == today and x.get("lang") == os.environ["L"]
                     and x.get("format") == os.environ["F"] for x in h):
                  skip = "true"
          print("already published today:", skip)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={skip}\n")
          PY
      - if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 >/dev/null
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: {python-version: "3.11"}
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -q pillow numpy edge-tts gTTS
      - name: إنتاج الفيديو
        if: steps.guard.outputs.skip != 'true'
        env:
          VIDEO_LANG: ${{ steps.cfg.outputs.lang }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEAD_MAGNET_URL_AR: ${{ vars.LEAD_MAGNET_URL_AR }}
          LEAD_MAGNET_URL_EN: ${{ vars.LEAD_MAGNET_URL_EN }}
          YT_PRIVACY: public
        run: python scripts/anatomy_main.py --format ${{ steps.cfg.outputs.format }} --template "${{ inputs.template }}"
      - name: نشر الإصدار
        if: steps.guard.outputs.skip != 'true'
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(basename $(ls out/*.mp4 | head -1) .mp4)
          TAG="anat-${{ steps.cfg.outputs.lang }}-$(date -u +%Y%m%d-%H%M%S)"
          TITLE=$(python -c "import json;print(json.load(open('out/latest.json',encoding='utf-8'))['title'])")
          gh release create "$TAG" "out/$B.mp4" "out/$B.jpg" "out/$B.json" --title "$TITLE" --notes "anatomy"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          echo "video_url=$BASE/$B.mp4" >> $GITHUB_OUTPUT
          echo "thumb_url=$BASE/$B.jpg" >> $GITHUB_OUTPUT
      - name: إشعار Make (يوتيوب + فيسبوك)
        if: steps.guard.outputs.skip != 'true'
        env:
          HOOK: ${{ steps.cfg.outputs.lang == 'en' && secrets.MAKE_WEBHOOK_EN || secrets.MAKE_WEBHOOK }}
          VIDEO_URL: ${{ steps.rel.outputs.video_url }}
          THUMB_URL: ${{ steps.rel.outputs.thumb_url }}
          L: ${{ steps.cfg.outputs.lang }}
        run: |
          [ -z "$HOOK" ] && { echo "no webhook"; exit 0; }
          python - <<'PY'
          import json, os, urllib.request
          m = json.load(open('out/latest.json', encoding='utf-8'))
          m.update(video_url=os.environ["VIDEO_URL"], thumb_url=os.environ["THUMB_URL"],
                   tags_text=",".join(m.get("tags", [])), lang=os.environ["L"])
          req = urllib.request.Request(os.environ["HOOK"], data=json.dumps(m, ensure_ascii=False).encode(),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=120).read().decode()[:200])
          PY
      - name: إرسال إلى تيليغرام (جاهز لتيك توك)
        if: steps.guard.outputs.skip != 'true' && steps.cfg.outputs.lang == 'en' && steps.cfg.outputs.format == 'shorts'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram"; exit 0; }
          python - <<'PY'
          import json, os, subprocess, glob
          m = json.load(open('out/latest.json', encoding='utf-8'))
          tags = " ".join("#" + t.replace("#", "").replace(" ", "") for t in m.get("tags", []) if t.strip())
          caption = f"{m['title']}\n\n{m['description']}\n\n{tags}"[:1000]
          vf = glob.glob('out/*.mp4')[0]
          subprocess.run(["curl", "-s", "-F", f"chat_id={os.environ['TELEGRAM_CHAT_ID']}", "-F", f"video=@{vf}",
                          "-F", "caption=🎬 New TikTok video ready — caption below 👇", "-F", "supports_streaming=true",
                          f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo"], check=True)
          subprocess.run(["curl", "-s", "--data-urlencode", f"chat_id={os.environ['TELEGRAM_CHAT_ID']}",
                          "--data-urlencode", f"text={caption}",
                          f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"], check=True)
          PY
      - name: حفظ السجل (لمنع التكرار)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "video-factory"; git config user.email "actions@github.com"
          git add assets/anatomy/history.json || true
          git commit -m "anatomy history [skip ci]" || echo "no changes"
          git pull --rebase || true; git push || true
