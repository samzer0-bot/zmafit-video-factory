name: توليد رسومات التمارين (Anatomy images)
on:
  push:
    branches: [anatomy-preview]
    paths: ["scripts/gen_anatomy_images.py", ".github/workflows/anatomy_images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: توليد
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gen_anatomy_images.py gen
      - name: نشر
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anatomy-images >/dev/null 2>&1 || gh release create anatomy-images --prerelease --title "Anatomy images" --notes "رسومات مولدة" --target anatomy-preview || true
          ls gen && gh release upload anatomy-images gen/* --clobber
