name: توليد رسومات التمارين (Anatomy images)
on:
  push:
    branches: [anatomy-preview]
    paths: ["assets/anatomy/GENERATE"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: توليد
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: pip install -q pillow && python scripts/gen_anatomy_images.py gen
      - name: نشر
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view anatomy-images >/dev/null 2>&1 || gh release create anatomy-images --prerelease --title "Anatomy images" --notes "رسومات مولدة" --target anatomy-preview || true
          ls gen && gh release upload anatomy-images gen/* --clobber
